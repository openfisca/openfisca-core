[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name="OpenFisca-Core"
version="44.7.1"
description="A versatile microsimulation free software"
readme = "README.md"
authors = [
  {name = "OpenFisca Team", email = "contact@openfisca.org"},
]
requires-python = ">=3.10"
classifiers=[
        "Development Status :: 5 - Production/Stable",
        "Operating System :: POSIX",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Scientific/Engineering :: Information Analysis",
    ]
keywords= ["benefit", "microsimulation", "social", "tax"]
# Please make sure to cap all dependency versions, in order to avoid unwanted
# functional and integration breaks caused by external code updates.
# DO NOT add space between '>=' and version number as it break conda build.
dependencies = [
    "PyYAML >=6.0.1, <7.0",
    "StrEnum >=0.4.8, <0.5.0", # 3.11.x backport
    "dpath >=2.2.0, <3.0",
    "numexpr >=2.10.1, <3.0",
    "numpy >=1.24.2, <=3 ; python_version < \"3.12\"",
    "numpy >=2.0.2, <=3 ; python_version >= \"3.12\"",
    "pendulum >=3.0.0, <4.0.0",
    "psutil >=5.9.4, <6.0",
    "pytest >=8.3.3, <9.0",
    "sortedcontainers >=2.4.0, <3.0",
    "typing_extensions >=4.16.0, <5.0",
]

license="AGPL-3.0-or-later"
license-files=["LICENSE"]

[project.scripts]
openfisca="openfisca_core.scripts.openfisca_command:main"
openfisca-run-test="openfisca_core.scripts.openfisca_command:main"

[project.urls]
Homepage = "https://github.com/openfisca/openfisca-core"
Documentation = "https://openfisca.org/doc/"
Repository = "https://github.com/openfisca/openfisca-core.git"

[project.optional-dependencies]
web-api = [
    "Flask >=2.2.3, <4.0",
    "Flask-Cors >=3.0.10, <4.0",
    "gunicorn >=21.0, <22.0",
    "Werkzeug >=2.2.3, <4.0",
]

template=[
    "openfisca-country-template",
    "openfisca-extension-template >=2.0.6, <3"
]

[tool.black]
target-version = [ "py310", "py311", "py312", "py313" ]

[tool.codespell]
ignore-words-list = [
    "THIRDPARTY",
    "ans",
    "constitue",
    "exemple",
    "fonction",
    "impot",
    "treshold",
]
skip = [
"*.egg-info",
"./venv",
]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "TRY004",
    "TRY002",
    "RUF012",
    "PLW1510",
    "PLC0105",
    "DTZ007",
    "B019",
    "DTZ012",
    "S102",
]

[dependency-groups]
dev = [
    "codespell >=2.3.0, <3.0",
    "colorama >=0.4.4, <0.5",
    "darglint >=1.8.1, <2.0",
    "docutils",
    "idna >=3.10, <4.0",
    "isort >=5.13.2, <6.0",
    "mypy >=1.11.2, <2.0",
    "openapi-spec-validator >=0.7.1, <0.8.0",
    "pyright >=1.1.382, <2.0",
    "ruff>=0.16.7",
    "ruff-lsp >=0.0.57, <1.0",
    "OpenFisca-Core[web-api]",
    "twine",
]
