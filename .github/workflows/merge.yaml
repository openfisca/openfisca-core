---
name: OpenFisca-Core / Deploy package to PyPi

env:
  UPPER_PYTHON_VERSION: &upper_pyver 3.13.11

on:
  push:
    branches: [main]

concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-jobs:
    uses: $/.github/workflows/push.yaml

  publish-to-pypi:
    needs: [push-jobs]
    if: needs.push-jobs.outputs.has-functional-changes == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish

      - name: Update doc
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer \
              ${{ secrets.OPENFISCADOC_BOT_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main"}' \
            https://api.github.com/repos/openfisca/openfisca-doc/actions/workflows/deploy.yaml/dispatches

  push-tag:
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Add tag on GitHub
        run: |
          uv version --short
          git tag `uv version --short`
          git push --tags
