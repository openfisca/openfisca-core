---
name: OpenFisca-Core / Deploy package to PyPi

env:
  UPPER_PYTHON_VERSION: &upper_pyver 3.13.11

on:
  push:
    branches: [xp_uv]

concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-for-functional-changes:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.stop-early.outputs.status }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
          python-version: *upper_pyver

      - id: stop-early
        # The `check-for-functional-changes` job should always succeed
        # regardless of the `has-functional-changes` script's exit code.
        # Consequently, we do not use that exit code to trigger deploy,
        # but rather a dedicated output variable `status`, to avoid a job
        # failure if the exit code is different from 0. Conversely,
        # if the job fails the entire workflow would be marked as `failed`
        # which is disturbing for contributors.
        run: |
          if "${GITHUB_WORKSPACE}/.github/has-functional-changes.sh" ; then
            echo "::set-output name=status::success" ;
          fi

  push-jobs:
    needs: [check-for-functional-changes]
    if: needs.check-for-functional-changes.outputs.status == 'success'
    uses: $/.github/workflows/push.yaml

  publish-to-pypi:
    needs: [push-jobs]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish

      - name: Update doc
        run: |
          curl -L
            -X POST
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer \
              ${{ secrets.OPENFISCADOC_BOT_ACCESS_TOKEN }}"
            -H "X-GitHub-Api-Version: 2022-11-28"
            https://api.github.com/repos/openfisca/openfisca-doc/actions/workflows/deploy.yaml/dispatches
            -d '{"ref":"main"}'

  push-tag:
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Add tag on GitHub
        run: |
          uv version --short
          git tag `uv version --short`
          git push --tags

  test-on-windows:
    runs-on: windows-2025
    needs: [push-jobs, publish-to-pypi]
    defaults:
      run:
        shell: bash

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install openfisca-core from PyPi
        env:
          VERSION: ${{ needs.push-jobs.outputs.version }}
        # PyPi's index can lag a few seconds behind an upload,
        # hence the retries.
        run: |
          uv venv --python ${{ env.UPPER_PYTHON_VERSION }}
          installed=false
          for attempt in $(seq 1 5); do
            if uv pip install "openfisca-core==$VERSION"; then
              installed=true
              break
            fi
            echo "openfisca-core $VERSION not on PyPi yet,"
            echo "retrying in 30s (attempt $attempt/5)…"
            sleep 30
          done
          if [ "$installed" = false ]; then
            echo "Could not install openfisca-core $VERSION from PyPi."
            exit 1
          fi

      - name: Test openfisca
        run: |
          source .venv/Scripts/activate
          openfisca --help
